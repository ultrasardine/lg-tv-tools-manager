[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lg-tv-tools"
version = "0.3.0"
description = "LG webOS discovery, DLNA media casting, and remote control for desktop and mobile"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "flet>=0.27",
    "websockets>=16.1.1",
]

authors = [
    { name = "Reynaldo Rodriguez" }
]

[project.optional-dependencies]
# Desktop extras - full feature set
desktop = [
    "flet-desktop>=0.27",
    "netifaces2>=0.0.22",
    "zeroconf>=0.150.0",
]

# Legacy PyQt6 UI (deprecated)
qt = [
    "PyQt6>=6.6",
    "netifaces>=0.11.0",
    "zeroconf>=0.150.0",
]

# All optional dependencies
all = [
    "netifaces2>=0.0.22",
    "zeroconf>=0.150.0",
    "PyQt6>=6.6",
]

[project.scripts]
# Flet applications
lg-tv-tools = "lgtvtools.flet_ui.app:main"
lg-tv-remote = "lgtvtools.flet_ui.app_mobile:main"

# Legacy PyQt6 application (deprecated)
lg-tv-tools-qt = "lgtvtools.app:main"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument
]

[tool.ruff.lint.isort]
known-first-party = ["lgtvtools"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"
