[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lg-tv-tools"
version = "0.2.0"
description = "LG webOS discovery and DLNA media casting utility for Linux desktops"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "PyQt6>=6.6"
]

authors = [
    { name = "Reynaldo Rodríguez", email = "rey.amado8509@gmail.com" }
]

[project.scripts]
lg-tv-tools = "lgtvtools.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
