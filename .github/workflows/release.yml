name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: lg-tv-tools
  PYTHON_VERSION: "3.11"

jobs:
  # Build standalone executables for each platform
  build-executables:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: lg-tv-tools-linux-x64
            asset_ext: .tar.gz
          - os: macos-latest
            platform: macos
            artifact_name: lg-tv-tools-macos-arm64
            asset_ext: .tar.gz
          - os: windows-latest
            platform: windows
            artifact_name: lg-tv-tools-windows-x64
            asset_ext: .zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra desktop

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable (Unix)
        if: matrix.platform != 'windows'
        run: |
          uv run pyinstaller lg-tv-tools.spec

      - name: Build executable (Windows)
        if: matrix.platform == 'windows'
        run: |
          uv run pyinstaller lg-tv-tools.spec

      - name: Package artifact (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar -czvf ${{ matrix.artifact_name }}${{ matrix.asset_ext }} ${{ env.APP_NAME }}

      - name: Package artifact (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist
          # If .app bundle exists, package that; otherwise package the executable
          if [ -d "${{ env.APP_NAME }}.app" ]; then
            tar -czvf ${{ matrix.artifact_name }}${{ matrix.asset_ext }} "${{ env.APP_NAME }}.app"
          else
            tar -czvf ${{ matrix.artifact_name }}${{ matrix.asset_ext }} ${{ env.APP_NAME }}
          fi

      - name: Package artifact (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd dist
          Compress-Archive -Path "${{ env.APP_NAME }}.exe" -DestinationPath "${{ matrix.artifact_name }}${{ matrix.asset_ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}${{ matrix.asset_ext }}
          retention-days: 7

  # Build Python package (sdist and wheel)
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 7

  # Create GitHub Release
  release:
    needs: [build-executables, build-python]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LG TV Tools v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/lg-tv-tools-linux-x64/*.tar.gz
            artifacts/lg-tv-tools-macos-arm64/*.tar.gz
            artifacts/lg-tv-tools-windows-x64/*.zip
            artifacts/python-package/*.whl
            artifacts/python-package/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
